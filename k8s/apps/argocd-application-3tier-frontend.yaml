apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vrs-3tier-frontend
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: visitor-registration-system
    app.kubernetes.io/component: frontend
    architecture: split-tier
    environment: staging
  annotations:
    # Human-readable description shown in ArgoCD UI
    argocd.argoproj.io/description: "3-Tier frontend — Next.js UI only (no API routes)"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: visitor-registration-system
  source:
    repoURL: https://github.com/aungyephyo2215/vct-visitor-registration-system.git
    targetRevision: arch/k8s-split-tier-deployment
    # ✅ Points to frontend-only overlay — deploys ONLY vrs-frontend namespace resources
    path: k8s/overlays/staging-split/frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: vrs-frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  info:
    - name: architecture
      value: 3-tier split
    - name: tier
      value: frontend
    - name: environment
      value: staging
    - name: branch
      value: arch/k8s-split-tier-deployment
    - name: image
      value: ghcr.io/aungyephyo2215/visitor-registration-system/frontend:staging
    - name: url
      value: https://vrs-frontend.k8s.cmtmm.online
