apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-qr-svc
  namespace: vrs-qr-svc
  labels:
    app.kubernetes.io/name: vrs-qr-svc
    app.kubernetes.io/component: qr-svc
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vrs-qr-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vrs-qr-svc
        app.kubernetes.io/component: qr-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z vrs-postgres.vrs-postgres.svc.cluster.local 5432; do
                echo "Waiting for PostgreSQL..."; sleep 2
              done && echo "PostgreSQL ready!"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: vrs-qr-svc
          # Owns: /api/v1/qr  /api/v1/verify  /api/v1/invitations
          # See: docker/services/Dockerfile.qr-svc
          image: ghcr.io/aungyephyo2215/visitor-registration-system/qr-svc:staging
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 4003
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vrs-qr-svc-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vrs-qr-svc-secret
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: vrs-qr-svc-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: vrs-qr-svc-config
                  key: PORT
            - name: QR_EXPIRES_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: vrs-qr-svc-config
                  key: QR_EXPIRES_MINUTES
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: vrs-qr-svc-config
                  key: AUTH_SERVICE_URL
            - name: VISITOR_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: vrs-qr-svc-config
                  key: VISITOR_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: vrs-qr-svc-config
                  key: NOTIFICATION_SERVICE_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: vrs-qr-svc-config
                  key: CORS_ORIGIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
