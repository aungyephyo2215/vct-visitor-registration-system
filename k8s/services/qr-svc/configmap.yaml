apiVersion: v1
kind: ConfigMap
metadata:
  name: vrs-qr-svc-config
  namespace: vrs-qr-svc
  labels:
    app.kubernetes.io/name: vrs-qr-svc
    app.kubernetes.io/component: qr-svc
data:
  NODE_ENV: "production"
  PORT: "4003"
  # Routes owned: /api/v1/qr  /api/v1/verify  /api/v1/invitations
  QR_EXPIRES_MINUTES: "1440"
  DB_POOL_MAX: "5"
  DB_IDLE_TIMEOUT_MS: "30000"
  DB_CONNECT_TIMEOUT_MS: "5000"
  CORS_ORIGIN: "https://vrs.k8s.cmtmm.online"
  AUTH_SERVICE_URL: "http://vrs-auth-svc.vrs-auth-svc.svc.cluster.local:4001"
  VISITOR_SERVICE_URL: "http://vrs-visitor-svc.vrs-visitor-svc.svc.cluster.local:4002"
  NOTIFICATION_SERVICE_URL: "http://vrs-notification-svc.vrs-notification-svc.svc.cluster.local:4004"
