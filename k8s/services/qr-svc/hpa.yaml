apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vrs-qr-svc
  namespace: vrs-qr-svc
  labels:
    app.kubernetes.io/name: vrs-qr-svc
    app.kubernetes.io/component: qr-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vrs-qr-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
