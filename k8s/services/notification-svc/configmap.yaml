apiVersion: v1
kind: ConfigMap
metadata:
  name: vrs-notification-svc-config
  namespace: vrs-notification-svc
  labels:
    app.kubernetes.io/name: vrs-notification-svc
    app.kubernetes.io/component: notification-svc
data:
  NODE_ENV: "production"
  PORT: "4004"
  # Routes owned: /api/v1/notifications
  EMAIL_PROVIDER: "smtp"
  EMAIL_FROM: "Visitor Registration <no-reply@k8s.cmtmm.online>"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_REQUIRE_TLS: "false"
  CORS_ORIGIN: "https://vrs.k8s.cmtmm.online"
  APP_BASE_URL: "https://vrs.k8s.cmtmm.online"
