apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-notification-svc
  namespace: vrs-notification-svc
  labels:
    app.kubernetes.io/name: vrs-notification-svc
    app.kubernetes.io/component: notification-svc
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vrs-notification-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vrs-notification-svc
        app.kubernetes.io/component: notification-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vrs-notification-svc
          # Owns: /api/v1/notifications — email dispatch, SMS stubs
          # See: docker/services/Dockerfile.notification-svc
          image: ghcr.io/aungyephyo2215/visitor-registration-system/notification-svc:staging
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 4004
              name: http
              protocol: TCP
          env:
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: vrs-notification-svc-secret
                  key: SMTP_PASS
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: vrs-notification-svc-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: vrs-notification-svc-config
                  key: PORT
            - name: EMAIL_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: vrs-notification-svc-config
                  key: EMAIL_PROVIDER
            - name: EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: vrs-notification-svc-config
                  key: EMAIL_FROM
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: vrs-notification-svc-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: vrs-notification-svc-config
                  key: SMTP_PORT
            - name: SMTP_SECURE
              valueFrom:
                configMapKeyRef:
                  name: vrs-notification-svc-config
                  key: SMTP_SECURE
            - name: SMTP_REQUIRE_TLS
              valueFrom:
                configMapKeyRef:
                  name: vrs-notification-svc-config
                  key: SMTP_REQUIRE_TLS
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: vrs-notification-svc-config
                  key: APP_BASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
