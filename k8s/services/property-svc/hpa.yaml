apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vrs-property-svc
  namespace: vrs-property-svc
  labels:
    app.kubernetes.io/name: vrs-property-svc
    app.kubernetes.io/component: property-svc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vrs-property-svc
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
