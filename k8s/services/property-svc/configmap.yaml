apiVersion: v1
kind: ConfigMap
metadata:
  name: vrs-property-svc-config
  namespace: vrs-property-svc
  labels:
    app.kubernetes.io/name: vrs-property-svc
    app.kubernetes.io/component: property-svc
data:
  NODE_ENV: "production"
  PORT: "4005"
  # Routes owned: /api/v1/units  /api/v1/vehicles
  DB_POOL_MAX: "5"
  DB_IDLE_TIMEOUT_MS: "30000"
  DB_CONNECT_TIMEOUT_MS: "5000"
  CORS_ORIGIN: "https://vrs.k8s.cmtmm.online"
  AUTH_SERVICE_URL: "http://vrs-auth-svc.vrs-auth-svc.svc.cluster.local:4001"
