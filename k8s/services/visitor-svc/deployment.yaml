apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-visitor-svc
  namespace: vrs-visitor-svc
  labels:
    app.kubernetes.io/name: vrs-visitor-svc
    app.kubernetes.io/component: visitor-svc
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vrs-visitor-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vrs-visitor-svc
        app.kubernetes.io/component: visitor-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z vrs-postgres.vrs-postgres.svc.cluster.local 5432; do
                echo "Waiting for PostgreSQL..."; sleep 2
              done && echo "PostgreSQL ready!"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-auth-svc
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z vrs-auth-svc.vrs-auth-svc.svc.cluster.local 4001; do
                echo "Waiting for auth-svc..."; sleep 2
              done && echo "auth-svc ready!"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: vrs-visitor-svc
          # Owns: /api/v1/visitors  /api/v1/visits  /api/v1/checkin  /api/v1/checkout  /api/v1/badges
          # See: docker/services/Dockerfile.visitor-svc
          image: ghcr.io/aungyephyo2215/visitor-registration-system/visitor-svc:staging
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 4002
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vrs-visitor-svc-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vrs-visitor-svc-secret
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: vrs-visitor-svc-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: vrs-visitor-svc-config
                  key: PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: vrs-visitor-svc-config
                  key: AUTH_SERVICE_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: vrs-visitor-svc-config
                  key: CORS_ORIGIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
