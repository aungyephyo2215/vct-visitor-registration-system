apiVersion: v1
kind: ConfigMap
metadata:
  name: vrs-frontend-config
  namespace: vrs-frontend
  labels:
    app.kubernetes.io/name: vrs-frontend
    app.kubernetes.io/component: frontend
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_URL: "https://vrs.k8s.cmtmm.online"
  APP_BASE_URL: "https://vrs.k8s.cmtmm.online"
  # Each service URL (used for server-side Next.js fetch)
  AUTH_SERVICE_URL: "http://vrs-auth-svc.vrs-auth-svc.svc.cluster.local:4001"
  VISITOR_SERVICE_URL: "http://vrs-visitor-svc.vrs-visitor-svc.svc.cluster.local:4002"
  QR_SERVICE_URL: "http://vrs-qr-svc.vrs-qr-svc.svc.cluster.local:4003"
  NOTIFICATION_SERVICE_URL: "http://vrs-notification-svc.vrs-notification-svc.svc.cluster.local:4004"
  PROPERTY_SERVICE_URL: "http://vrs-property-svc.vrs-property-svc.svc.cluster.local:4005"
