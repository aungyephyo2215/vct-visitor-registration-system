apiVersion: v1
kind: Service
metadata:
  name: vrs-frontend
  namespace: vrs-frontend
  labels:
    app.kubernetes.io/name: vrs-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vrs-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
