apiVersion: v1
kind: ConfigMap
metadata:
  name: vrs-auth-svc-config
  namespace: vrs-auth-svc
  labels:
    app.kubernetes.io/name: vrs-auth-svc
    app.kubernetes.io/component: auth-svc
data:
  NODE_ENV: "production"
  PORT: "4001"
  # Routes owned: /api/v1/auth, /api/v1/users
  JWT_EXPIRES_IN: "24h"
  JWT_REFRESH_EXPIRES_IN: "7d"
  BCRYPT_ROUNDS: "12"
  DB_POOL_MAX: "5"
  DB_IDLE_TIMEOUT_MS: "30000"
  DB_CONNECT_TIMEOUT_MS: "5000"
  CORS_ORIGIN: "https://vrs.k8s.cmtmm.online"
