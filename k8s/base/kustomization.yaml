apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # PostgreSQL
  - postgres/namespace.yaml
  - postgres/configmap.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - postgres/network-policy.yaml
  - postgres/resource-quota.yaml
  - postgres/backup-cronjob.yaml

  # Frontend (Next.js UI only — no API routes)
  - frontend/namespace.yaml
  - frontend/configmap.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/ingress.yaml
  - frontend/hpa.yaml
  - frontend/network-policy.yaml
  - frontend/pdb.yaml

  # API Service (Hono/Express — all /api/v1/* routes)
  - api/namespace.yaml
  - api/configmap.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/ingress.yaml
  - api/hpa.yaml
  - api/network-policy.yaml
  - api/pdb.yaml

commonLabels:
  app.kubernetes.io/part-of: visitor-registration-system
  managed-by: argocd
