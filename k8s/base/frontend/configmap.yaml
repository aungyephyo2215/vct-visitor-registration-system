apiVersion: v1
kind: ConfigMap
metadata:
  name: vrs-frontend-config
  namespace: vrs-frontend
  labels:
    app.kubernetes.io/name: vrs-frontend
    app.kubernetes.io/component: frontend
data:
  NODE_ENV: "production"
  # Points to the internal API service (cluster-internal DNS)
  NEXT_PUBLIC_API_URL: "https://api.vrs.k8s.cmtmm.online"
  INTERNAL_API_URL: "http://vrs-api.vrs-api.svc.cluster.local:4000"
  NEXT_PUBLIC_APP_URL: "https://vrs.k8s.cmtmm.online"
  APP_BASE_URL: "https://vrs.k8s.cmtmm.online"
