apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vrs-frontend-netpol
  namespace: vrs-frontend
  labels:
    app.kubernetes.io/name: vrs-frontend
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vrs-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from nginx ingress controller only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound to API service
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vrs-api
      ports:
        - protocol: TCP
          port: 4000
    # Allow HTTPS to external services (cert-manager, etc.)
    - ports:
        - protocol: TCP
          port: 443
