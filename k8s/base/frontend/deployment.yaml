apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-frontend
  namespace: vrs-frontend
  labels:
    app.kubernetes.io/name: vrs-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vrs-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vrs-frontend
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vrs-frontend
          # NOTE: Build a separate frontend image (Next.js UI only, no API routes)
          # See: docker/Dockerfile.frontend
          image: ghcr.io/aungyephyo2215/visitor-registration-system/frontend:staging
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: vrs-frontend-config
                  key: NODE_ENV
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: vrs-frontend-config
                  key: NEXT_PUBLIC_API_URL
            - name: INTERNAL_API_URL
              valueFrom:
                configMapKeyRef:
                  name: vrs-frontend-config
                  key: INTERNAL_API_URL
            - name: NEXT_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: vrs-frontend-config
                  key: NEXT_PUBLIC_APP_URL
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: vrs-frontend-config
                  key: APP_BASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
