apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vrs-api-netpol
  namespace: vrs-api
  labels:
    app.kubernetes.io/name: vrs-api
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vrs-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from nginx ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4000
    # Allow traffic from frontend namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vrs-frontend
      ports:
        - protocol: TCP
          port: 4000
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound to PostgreSQL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vrs-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow SMTP (email)
    - ports:
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
