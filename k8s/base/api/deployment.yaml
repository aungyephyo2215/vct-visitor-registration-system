apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-api
  namespace: vrs-api
  labels:
    app.kubernetes.io/name: vrs-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vrs-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vrs-api
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 1. Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z vrs-postgres.vrs-postgres.svc.cluster.local 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

        # 2. Run Prisma migrations
        - name: run-migrations
          image: ghcr.io/aungyephyo2215/visitor-registration-system/api:staging
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vrs-api-secret
                  key: DIRECT_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

        # 3. Seed database (skips if data exists)
        - name: seed-database
          image: ghcr.io/aungyephyo2215/visitor-registration-system/api:staging
          command: ["npx", "prisma", "db", "seed"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vrs-api-secret
                  key: DIRECT_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

      containers:
        - name: vrs-api
          # NOTE: Build a separate API image (Hono/Express, no Next.js pages)
          # See: docker/Dockerfile.api
          image: ghcr.io/aungyephyo2215/visitor-registration-system/api:staging
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vrs-api-secret
                  key: DATABASE_URL
            - name: DIRECT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vrs-api-secret
                  key: DIRECT_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vrs-api-secret
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: vrs-api-secret
                  key: JWT_REFRESH_SECRET
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: vrs-api-secret
                  key: SMTP_PASS
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: PORT
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: JWT_EXPIRES_IN
            - name: JWT_REFRESH_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: JWT_REFRESH_EXPIRES_IN
            - name: BCRYPT_ROUNDS
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: BCRYPT_ROUNDS
            - name: QR_EXPIRES_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: QR_EXPIRES_MINUTES
            - name: QR_EMAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: QR_EMAIL_ENABLED
            - name: EMAIL_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: EMAIL_PROVIDER
            - name: EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: EMAIL_FROM
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: SMTP_PORT
            - name: SMTP_SECURE
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: SMTP_SECURE
            - name: SMTP_REQUIRE_TLS
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: SMTP_REQUIRE_TLS
            - name: DB_POOL_MAX
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: DB_POOL_MAX
            - name: DB_IDLE_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: DB_IDLE_TIMEOUT_MS
            - name: DB_CONNECT_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: DB_CONNECT_TIMEOUT_MS
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: vrs-api-config
                  key: CORS_ORIGIN
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
