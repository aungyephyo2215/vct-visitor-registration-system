apiVersion: v1
kind: ConfigMap
metadata:
  name: vrs-api-config
  namespace: vrs-api
  labels:
    app.kubernetes.io/name: vrs-api
    app.kubernetes.io/component: api
data:
  NODE_ENV: "production"
  PORT: "4000"
  JWT_EXPIRES_IN: "24h"
  JWT_REFRESH_EXPIRES_IN: "7d"
  BCRYPT_ROUNDS: "12"
  QR_EXPIRES_MINUTES: "1440"
  QR_EMAIL_ENABLED: "true"
  EMAIL_PROVIDER: "smtp"
  EMAIL_FROM: "Visitor Registration <no-reply@k8s.cmtmm.online>"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_REQUIRE_TLS: "false"
  # Connection pool settings (per pod)
  DB_POOL_MAX: "10"
  DB_IDLE_TIMEOUT_MS: "30000"
  DB_CONNECT_TIMEOUT_MS: "5000"
  APP_BASE_URL: "https://vrs.k8s.cmtmm.online"
  # CORS: allow frontend origin only
  CORS_ORIGIN: "https://vrs.k8s.cmtmm.online"
