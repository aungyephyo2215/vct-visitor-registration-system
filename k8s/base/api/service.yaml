apiVersion: v1
kind: Service
metadata:
  name: vrs-api
  namespace: vrs-api
  labels:
    app.kubernetes.io/name: vrs-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vrs-api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
