apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/resource-limits.yaml
  - path: patches/ingress-hosts.yaml
  - path: patches/container-images.yaml

configMapGenerator:
  - name: vrs-frontend-config
    namespace: vrs-frontend
    behavior: merge
    literals:
      - NEXT_PUBLIC_APP_URL=https://vrs-staging.k8s.cmtmm.online
      - APP_BASE_URL=https://vrs-staging.k8s.cmtmm.online
      - NEXT_PUBLIC_API_URL=https://api-staging.vrs.k8s.cmtmm.online
      - INTERNAL_API_URL=http://vrs-api.vrs-api.svc.cluster.local:4000

  - name: vrs-api-config
    namespace: vrs-api
    behavior: merge
    literals:
      - APP_BASE_URL=https://vrs-staging.k8s.cmtmm.online
      - CORS_ORIGIN=https://vrs-staging.k8s.cmtmm.online
      - EMAIL_PROVIDER=noop
