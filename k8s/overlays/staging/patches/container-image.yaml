apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrs-app
  namespace: vrs-app
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent

        # ── IMAGE TAG MANAGED BY CI ──────────────────────────────────────────
        # DO NOT edit the image tags below manually.
        # The workflow .github/workflows/build-k8s-image.yml updates these
        # automatically after every push to staging/argocd-k8s-lab.
        # ArgoCD detects the git change here and triggers a rolling update.
        # ─────────────────────────────────────────────────────────────────────
        - name: run-migrations
          image: docker.io/aungkyawmyint/vrs:a65a2f0
          imagePullPolicy: Always

        - name: seed-database
          image: docker.io/aungkyawmyint/vrs:a65a2f0
          imagePullPolicy: Always

      containers:
        - name: vrs-app
          image: docker.io/aungkyawmyint/vrs:a65a2f0
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
