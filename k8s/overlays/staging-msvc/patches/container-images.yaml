# Override container images with staging tags
- target:
    kind: Deployment
    name: vrs-frontend
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: ghcr.io/aungyephyo2215/visitor-registration-system/frontend:staging

