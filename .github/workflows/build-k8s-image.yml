name: Build & Deploy K8s Image

on:
  push:
    branches: [staging/argocd-k8s-lab]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: aungkyawmyint/vrs
  IMAGE_PATCH_FILE: k8s/overlays/staging/patches/container-image.yaml

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Compute short SHA ─────────────────────────────────────────────────
      - name: Compute short SHA tag
        id: sha
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Short SHA: ${SHORT_SHA}"

      # ── Build & push image ────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          # :abc1234 → immutable SHA tag  (ArgoCD detects this change in git)
          # :staging  → mutable tag       (convenient for manual pulls)
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      # ── GitOps commit back ────────────────────────────────────────────────
      # Update the image tag in the manifest and push back to the same branch.
      # ArgoCD detects this git change and triggers a rolling update.
      - name: Update image tag in manifest
        if: github.event_name == 'push'
        run: |
          SHORT_SHA="${{ steps.sha.outputs.tag }}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"

          sed -i "s|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|${FULL_IMAGE}|g" \
            ${{ env.IMAGE_PATCH_FILE }}

          echo "Updated manifest:"
          cat ${{ env.IMAGE_PATCH_FILE }}

      - name: Commit and push updated image tag
        if: github.event_name == 'push'
        run: |
          SHORT_SHA="${{ steps.sha.outputs.tag }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet ${{ env.IMAGE_PATCH_FILE }}; then
            echo "No image tag change — skipping commit"
            exit 0
          fi

          git add ${{ env.IMAGE_PATCH_FILE }}
          git commit -m "chore(k8s): update staging image tag to ${SHORT_SHA}

          Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}
          Commit: ${{ github.sha }}

          ArgoCD detects this change and triggers a rolling update."

          git push origin staging/argocd-k8s-lab

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Deployment summary
        if: github.event_name == 'push'
        run: |
          SHORT_SHA="${{ steps.sha.outputs.tag }}"
          echo "## Build & GitOps Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA tag** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Stable tag** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`staging/argocd-k8s-lab\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD detects the manifest change and triggers a rolling update." >> $GITHUB_STEP_SUMMARY
